repos:
  - repo: local
    hooks:
      - id: python-format
        name: Python format
        entry: uv run ruff format --check
        language: system
        types: [python]
      - id: python-lint
        name: Python lint
        entry: uv run ruff check
        language: system
        types: [python]
      - id: web-format
        name: Web format
        entry: bash -c 'cd web && npx prettier --check .'
        language: system
        files: ^web/
        pass_filenames: false
