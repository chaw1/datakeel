[package]
name = "datakeel-accel"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Optional integer comparison kernels for Datakeel"
license = "Apache-2.0"
publish = false

[lib]
name = "_native"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "=0.30.1", features = ["abi3-py312"] }
rayon = "=1.11.0"

[features]
extension-module = ["pyo3/extension-module"]

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[lints.rust]
unsafe_code = "forbid"
