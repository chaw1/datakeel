[build-system]
requires = ["maturin==1.13.1"]
build-backend = "maturin"

[project]
name = "datakeel-accel"
version = "0.1.0"
description = "Optional Rust comparison and training fingerprint kernels for Datakeel"
requires-python = ">=3.12"
license = "Apache-2.0"

[tool.maturin]
features = ["extension-module"]
python-source = "python"
module-name = "datakeel_accel._native"
strip = true

[tool.maturin.sbom]
# Keep local source paths and upstream contact metadata out of distribution artifacts.
# The locked dependency graph and complete upstream license texts are audited separately.
rust = false
auditwheel = false
