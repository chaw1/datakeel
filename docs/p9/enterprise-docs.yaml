- id: ent-en-03
  lang: en
  text: 'CRM Data Handbook

    The CRM data team belongs to the Commercial Division and is based in Shenzhen. Priya Natarajan leads the team and owns
    the sales table.

    The sales_amount metric is computed from the sales table, and sales_summary is derived from sales.

    Leo Fang owns the customer_count metric, which is computed from the customers table. Tom Becker owned the customers table
    until August; he has since left the company.

    The team uses HarborCRM for campaign tracking. Moving the campaigns table into a separate marketing warehouse is planned
    for next quarter.'
