  text: '供应链数据交接说明（2026 年 9 月）

    供应链数据组隶属于运营中心，常驻佛山。组长周岩负责出货额和出货量两个指标。

    出货额基于 shipments 表计算。shipments 表由 ERP 夜间同步任务从 erp_raw_shipments 抽取而来。

    原负责人何嘉已于九月调往财务部，不再维护 shipments 表。

    inventory 表目前由仓储组的唐蔚维护。'
