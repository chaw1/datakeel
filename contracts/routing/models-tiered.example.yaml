# Example tiered + backup routing profile using checked-in model-prices.yaml tariffs.
# Activate via DATAKEEL_MODEL_ROUTING_FILE=contracts/routing/models-tiered.example.yaml
# and validate with: uv run datakeel routing validate contracts/routing/models-tiered.example.yaml
version: 1
providers:
  fake:
    tiers:
      simple: fake-demo
      multi_step: fake-demo
      high_risk: fake-demo
    fallbacks:
      fake-demo: fake-script
  openai:
    tiers:
      simple: gpt-4.1-nano
      multi_step: gpt-4.1-mini
      high_risk: gpt-4.1
    fallbacks:
      gpt-4.1: gpt-4.1-mini
      gpt-4.1-mini: gpt-4.1-nano
  anthropic:
    tiers:
      simple: claude-haiku-4-5-20251001
      multi_step: claude-sonnet-4-20250514
      high_risk: claude-sonnet-4-5-20250929
    fallbacks:
      claude-sonnet-4-5-20250929: claude-sonnet-4-20250514
      claude-sonnet-4-20250514: claude-haiku-4-5-20251001
endpoints:
  api.deepseek.com:
    tiers:
      simple: deepseek-flash
      multi_step: deepseek-flash
      high_risk: deepseek-v4-pro
    fallbacks:
      deepseek-v4-pro: deepseek-flash
  dashscope.aliyuncs.com:
    tiers:
      simple: qwen3.5-flash
      multi_step: qwen3.7-plus
      high_risk: qwen3.8-max
    fallbacks:
      qwen3.8-max: qwen3.7-plus
      qwen3.7-plus: qwen3.5-flash
