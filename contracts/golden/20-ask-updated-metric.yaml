          owner: 零售运营负责人
          version: 1
          measure:
            table: ecommerce/main/orders
            column: ecommerce/main/orders/list_amount
            aggregation: sum
          filters:
          - column: ecommerce/main/orders/status
            op: eq
            value: completed
          time:
            column: ecommerce/main/orders/date
            granularity: day
          dimensions:
          - retail_region
          - retail_channel
          - retail_category
          caveats:
          - 数据完全合成；金额单位为人民币元。
          - 本指标口径独立，请勿将出货额、销售额和零售额互换。
      id: 20-update
  - tool_calls:
    - name: ask_data
      arguments:
        question: 上个季度华东区零售额是多少
        reference_instant: '2026-10-01T00:00:00Z'
      id: 20-after
