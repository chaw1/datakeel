id: 28-memory-write
description: memory write
config:
  model: fake-script
  budget:
    conversation_tokens: 400000
    daily_tokens: 2000000
turns:
- input: Remember catalog reports and their active records definition.
  script:
  - agent: main
    tool_calls:
    - id: advanced-call-22
      name: tool_search
      arguments:
        query: write_memory
  - agent: main
    tool_calls:
    - id: advanced-call-23
      name: write_memory
      arguments:
        content: Catalog reports contact sample@example.org on 2026-10-24.
  - agent: main
    content: Preference stored.
expect:
