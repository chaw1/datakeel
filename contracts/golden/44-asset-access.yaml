    script:
      - tool_calls:
          - name: tool_search
            arguments:
              query: ask_data
            id: asset-discover
      - tool_calls:
          - name: ask_data
            arguments:
              question: 上个季度华东区零售额是多少
              metric_id: retail_revenue
              actor: privileged-fixture
