      status: FAILED
      asset_refs_required: false
      content_schema:
        type: object
        maxProperties: 0
  answer_contains: [申请, 资产市场]
  answer_not_contains: ['4979475', '4,979,475']
  context_not_contains: ['4979475', '4,979,475', 'SELECT SUM']
  file_count: 1
