schema_version: '1.0'
algorithm: dhash
bits: 64
width: 9
height: 8
resampling: lanczos
hamming_threshold: 8
prefix_bits: 4
mode: prefix
# Prefix blocking bounds comparisons but can miss pairs across buckets. Exact
# mode indexes threshold + 1 disjoint segments and guarantees threshold recall.
# Direct pair distance only: no connected-component or transitive expansion.
