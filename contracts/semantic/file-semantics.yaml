  "roleRules": [
    {
      "id": "role.standard.v1",
      "priority": 500,
      "when": {
        "standardRole": "*"
      },
      "then": {
        "usageRole": "fromStandard",
        "confidence": 1.0
      }
    },
    {
      "id": "role.manifest.explicit.v1",
      "priority": 400,
      "when": {
        "manifestRole": "*"
      },
      "then": {
        "usageRole": "fromManifest",
        "confidence": 1.0
      }
    },
    {
      "id": "role.metadata.explicit-manifest.v1",
      "priority": 350,
      "when": {
        "parentRelationAny": [
          "manifest-for-archive"
        ]
      },
      "then": {
        "usageRole": "metadata",
        "confidence": 1.0
      }
    },
    {
      "id": "role.preview.path.v1",
      "priority": 300,
      "when": {
        "pathPrefixAny": [
          "_preview/",
          "_previews/"
        ]
      },
      "then": {
        "usageRole": "preview",
        "confidence": 1.0
      }
    },
    {
      "id": "role.artifact.path.processed.v1",
      "priority": 300,
      "when": {
        "pathPrefixAny": [
          "processed/"
        ]
      },
      "then": {
        "usageRole": "artifact",
        "confidence": 1.0
      }
    },
    {
      "id": "role.metadata.camera-config-path.v1",
      "priority": 300,
      "when": {
        "pathSegmentsAny": [
          "camera_config"
        ]
      },
      "then": {
        "usageRole": "metadata",
        "confidence": 0.85
      }
    },
    {
      "id": "role.annotation.path.v1",
      "priority": 300,
      "when": {
        "pathSegmentsAny": [
          "annotations",
          "labels"
        ]
      },
      "then": {
        "usageRole": "annotation",
        "confidence": 0.75
      }
    },
    {
      "id": "role.readme.filename.v1",
      "priority": 200,
      "when": {
        "fileNameRegex": "(?i)^readme(\\..*)?$"
      },
      "then": {
        "usageRole": "readme",
        "confidence": 1.0
      }
    },
    {
      "id": "role.manifest.filename.v1",
      "priority": 200,
      "when": {
        "fileNameRegex": "(?i)^manifest\\.json$",
        "pathDepthMax": 2
      },
      "then": {
        "usageRole": "metadata",
        "confidence": 0.6
      }
    },
    {
      "id": "role.artifact.suffix.result.v1",
      "priority": 200,
      "when": {
        "fileNameSuffixAny": [
          "_result.json"
        ]
      },
      "then": {
        "usageRole": "artifact",
        "confidence": 1.0
      }
    },
    {
      "id": "role.artifact.suffix.annotation.v1",
      "priority": 200,
      "when": {
        "fileNameSuffixAny": [
          "_annotation.json"
        ]
      },
      "then": {
        "usageRole": "artifact",
        "confidence": 1.0
      }
    },
    {
      "id": "role.payload.default.v1",
      "priority": 100,
      "when": {
        "formatCodesAny": [
          "structured-json"
        ],
        "datasetTypesNotAny": [
          "text"
        ]
      },
      "then": {
        "usageRole": "payload",
        "confidence": 0.5
      }
    }
  ],
  "invariants": {
    "unknownExtensionPolicy": "unknown",
    "conflictingRolePolicy": "ambiguous",
    "uniqueCodes": true,
    "uniqueExtensions": true,
    "aliasCycleCheck": true,
    "everyFormatHasDefaultModality": true,
    "samePriorityConflictIsSchemaError": true
  }
}
