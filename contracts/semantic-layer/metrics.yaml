  description: 以电商已完成订单的终端实付金额计量，包含订单优惠，未冲抵后续退款。
  owner: 零售运营负责人
  version: 1
  measure:
    table: ecommerce/main/orders
    column: ecommerce/main/orders/paid_amount
    aggregation: sum
  filters:
  - column: ecommerce/main/orders/status
    value: completed
    op: eq
  dimensions:
  - retail_region
  - retail_channel
  - retail_category
  caveats:
  - 数据完全合成；金额单位为人民币元。
  - 本指标口径独立，请勿将出货额、销售额和零售额互换。
