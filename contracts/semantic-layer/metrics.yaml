# All entities and data are fictional. Reference instant: 2026-10-01T00:00:00Z.
metrics:
- id: shipment_amount
  name: 出货额
  synonyms:
  - 发货金额
  - 出库金额
  description: 以ERP已出库商品的出货价计量，未扣终端促销及退款。
  owner: 供应链负责人
  version: 1
  measure:
    table: erp/main/shipments
    column: erp/main/shipments/shipped_amount
    aggregation: sum
  filters:
  - column: erp/main/shipments/status
    value: shipped
    op: eq
  dimensions:
  - shipment_region
  caveats:
  - 数据完全合成；金额单位为人民币元。
  - 本指标口径独立，请勿将出货额、销售额和零售额互换。
  time:
    column: erp/main/shipments/date
    granularity: day
- id: sales_amount
  name: 销售额
  synonyms:
  - 开票销售额
  - 营业额
  description: 以CRM已入账销售单的开票金额计量，含经销渠道。
  owner: 财务负责人
  version: 1
  measure:
    table: crm/main/sales
    column: crm/main/sales/invoiced_amount
    aggregation: sum
  filters:
  - column: crm/main/sales/status
    value: booked
    op: eq
  dimensions:
  - sales_region
  - sales_channel
  caveats:
  - 数据完全合成；金额单位为人民币元。
  - 本指标口径独立，请勿将出货额、销售额和零售额互换。
  time:
    column: crm/main/sales/date
    granularity: day
- id: retail_revenue
