# Offline default; real profiles are opt-in examples only. Cloud thinking modes require json_mode; credentials are environment-variable names only.
id: ollama
extractor: llm
provider: openai
model: qwen3.5:9b
base_url: http://localhost:11434/v1
api_key_env: null
output_method: json_schema
request_parameters:
  reasoning_effort: none
temperature: 0
max_output_tokens: 4096
# Ollama's VRAM-based default context may be only 4096 tokens.
# The built-in prompt plus one chunk uses roughly 1-2k input tokens, leaving ample headroom.
# Overlong output is recorded as a failed block; use server-side OLLAMA_CONTEXT_LENGTH
# before increasing chunk size.
chunk_size: 1000
chunk_overlap: 100
recording: null
