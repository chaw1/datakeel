# USD per million tokens; no live model requests are needed to use this snapshot.
# cache_write uses the five-minute tier. OpenAI has no separate cache-write charge.
version_date: 2026-10-22
currency: USD
unit: per_million_tokens
models:
  - model: fake-demo
    provider: fake
    input: 1.0
    output: 2.0
    cache_read: 0.1
    cache_write: 1.25
    source: local-deterministic-test-tariff-not-a-provider-charge
  - model: fake-script
    provider: fake
    input: 1.0
    output: 2.0
    cache_read: 0.1
    cache_write: 1.25
    source: local-deterministic-test-tariff-not-a-provider-charge
  - model: gpt-4.1-mini
    provider: openai
    input: 0.40
    output: 1.60
    cache_read: 0.10
    cache_write: 0.40
    source: https://developers.openai.com/api/docs/models/gpt-4.1-mini
  - model: claude-haiku-4-5-20251001
    provider: anthropic
    input: 1.0
    output: 5.0
    cache_read: 0.10
    cache_write: 1.25
    source: https://platform.claude.com/docs/en/about-claude/pricing
  # Checked 2026-10-24; peak prices are conservative. Off-peak prices are half.
  # Peak: weekdays UTC 01:00-04:00 and 06:00-10:00.
  - model: deepseek-flash
    provider: openai
    input: 0.3
    output: 1.2
    cache_read: 0.006
    cache_write: 0.3
    source: https://api-docs.deepseek.com/quick_start/pricing (2026-10-24; peak; off-peak half)
  # Checked 2026-10-28 on the official Model Studio price page (last updated 2026-10-27).
  # China (Beijing) endpoint dashscope.aliyuncs.com, tier 0 < input <= 128K tokens per request;
  # longer requests bill at 0.115/1.147 (<= 256K) or 0.172/1.72 (<= 1M). Thinking and
  # non-thinking modes share one price. No cache-hit price is published, so cached input is
  # charged at the full input price.
  - model: qwen3.5-flash
    provider: openai
    input: 0.029
    output: 0.287
    cache_read: 0.029
    cache_write: 0.029
    source: https://www.alibabacloud.com/help/en/model-studio/model-pricing (2026-10-27; China (Beijing); input <= 128K; no published cache-hit price)
