id: dataset-health
name: 新数据集体检 / Dataset health check
description: Process an imported dataset, inspect quality and evidence, and produce
  a deterministic conclusion.
inputs:
  dataset_id:
    type: string
    description: Already imported dataset identifier / 已导入的数据集 ID
triggers:
  keywords:
  - - 数据集|dataset|datasets
    - 体检|健康检查|health check|checkup
    - 做|运行|执行|启动|开展|run|perform|conduct|start|begin|prioritize|do
  classification_keywords:
  - 体检
  - health check
  - checkup
  classification_groups:
  - - 数据集|dataset|datasets|这批数据|这份数据
    - 全面|完整|整体|端到端|full|complete|comprehensive|overall|end-to-end
    - 检查|诊断|检测|评估|审查|check|inspect|audit|examine|assess|assessment
  - - 数据集|dataset|datasets|这批数据|这份数据
    - 健康|状况|可用性|health|readiness
    - 评估|检查|诊断|assess|inspect|audit|examine
  - - 数据集|dataset|datasets|这批数据|这份数据
    - 预处理|流水线|preprocessing|pipeline
    - 质量|quality
    - 证据|报告|结论|evidence|report|conclusion
    - 检查|评估|处理|inspect|assess|process|processing|summarize
  verification_keywords:
  - 数据集|dataset|datasets|这批数据|这份数据
  - 体检|checkup|health check
  excluded_keywords:
  - 谁|负责人|who|owner|where|哪里|如果|假如|if|suppose
  - 别清理|别删除|别修改|别改|先别|暂时别|不修改|不更改|无需|without
  - 备注|名称|名字|说明文档|description|documentation|name|label|layout|formatting
  - explain
  - what is
  - what does
  - how does
  - do not
  - don't
  - 不要
  - 解释
  - 说明一下
  - 是什么
  - 仅查看
  - 只查看
  - 介绍|说明|如何|怎么|how to|how do
  - 什么|哪些|为什么|是否|需不需要|what|why|how|does
  excluded_prefixes:
  - 查看|查询|列出|显示|展示|获取|show|list|display|find|get|tell|read|describe|should
  excluded_groups:
  - - 查看|查询|列出|显示|展示|看看|看一下|read|look at|bring up|show|list|display|find|get
    - 历史|记录|日志|状态|进度|上次|最近一次|history|record|records|log|logs|status|progress|previous|last|latest
  threshold: 1
  margin: 1
entry: pipeline
steps:
- id: pipeline
  title:
    zh: 运行预处理流水线
    en: Run preprocessing pipeline
  type: tool
  tool: run_pipeline
  arguments:
    dataset_id: ${inputs.dataset_id}
  next: wait
- id: wait
  title:
    zh: 等待流水线完成
    en: Wait for pipeline completion
  type: wait
  task_id: ${steps.pipeline.task_id}
  timeout_seconds: 60
  poll_interval: 0.25
  next: quality
- id: quality
  title:
    zh: 检查质量评分
    en: Inspect quality score
  type: tool
  tool: get_quality
  arguments:
    dataset_id: ${inputs.dataset_id}
  next: report
- id: report
  title:
    zh: 生成质量报告
    en: Generate quality report
  type: tool
  tool: get_report
  arguments:
    dataset_id: ${inputs.dataset_id}
  next: evidence
- id: evidence
  title:
    zh: 汇总质量证据
    en: Summarize quality evidence
  type: tool
  tool: query_evidence
  arguments:
    dataset_id: ${inputs.dataset_id}
  next: score
- id: score
  title:
    zh: 判断质量是否达标
    en: Check quality threshold
  type: branch
  ref: ${steps.quality.data.total}
  op: gte
  value: 80
  then: healthy
  otherwise: review
- id: healthy
  title:
    zh: 得出健康结论
    en: Conclude healthy
  type: output
  value:
    conclusion: healthy
    total: ${steps.quality.data.total}
    report: ${steps.report.data.body}
    evidence_total: ${steps.evidence.data.total}
- id: review
  title:
    zh: 提示质量复查
    en: Recommend quality review
  type: output
  value:
    conclusion: needs_review
    total: ${steps.quality.data.total}
    report: ${steps.report.data.body}
    evidence_total: ${steps.evidence.data.total}
