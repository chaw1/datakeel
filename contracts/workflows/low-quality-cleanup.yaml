entry: find
steps:
- id: find
  title:
    zh: 查找低质文件
    en: Find low-quality files
  type: tool
  tool: search_files
  arguments:
    dataset_id: ${inputs.dataset_id}
    quality_max: ${inputs.quality_max}
    limit: 1000
  next: has_files
- id: has_files
  title:
    zh: 判断是否需要清理
    en: Check whether cleanup is needed
  type: branch
  ref: ${steps.find.data.objects}
  op: ne
  value: []
  then: quarantine
  otherwise: empty
- id: quarantine
  title:
    zh: 隔离低质文件
    en: Quarantine low-quality files
  type: tool
  tool: quarantine_files
  arguments:
    selection: &id001
      dataset_id: ${inputs.dataset_id}
      filters:
      - field: id
        operator: in
        value:
          $pluck:
          - ${steps.find.data.objects}
          - asset_ref.asset_id
  next: delete
- id: delete
  title:
    zh: 签批并删除文件
    en: Approve and delete files
  type: approval
  action: delete_files
  arguments:
    selection: *id001
  next: quality
- id: quality
  title:
    zh: 复查质量评分
    en: Recheck quality score
  type: tool
  tool: get_quality
  arguments:
    dataset_id: ${inputs.dataset_id}
  next: result
- id: result
  title:
    zh: 汇总清理结果
    en: Summarize cleanup results
  type: output
  value:
    conclusion: cleaned
    total: ${steps.quality.data.total}
    file_count: ${steps.quality.data.file_count}
- id: empty
  title:
    zh: 确认无需清理
    en: Confirm no cleanup is needed
  type: output
  value:
    conclusion: no_low_quality_files
