id: low-quality-cleanup
name: 低质样本清理 / Low-quality sample cleanup
description: Select low-quality files, quarantine them, request deletion approval,
  and inspect quality again.
inputs:
  dataset_id:
    type: string
    description: Already imported dataset identifier / 已导入的数据集 ID
  quality_max:
    type: number
    description: Maximum selected quality score / 低质分数上限
    default: 60
triggers:
  keywords:
  - - 低质|低质量|low-quality|low quality|poor-quality|poor quality
    - 样本|文件|sample|samples|file|files
    - 清理|cleanup|clean up
  classification_keywords:
  - 清理
  - cleanup
  - clean up
  excluded_keywords:
  - explain
  - what is
  - what does
  - how does
  - do not
  - don't
  - 不要
  - 解释
  - 说明一下
  - 是什么
  - 仅查看
  - 只查看
  - 介绍|说明|如何|怎么|how to|how do
  - 什么|哪些|为什么|是否|需不需要|what|why|how|does|should
  excluded_prefixes:
  - 查看|查询|列出|显示|展示|获取|show|list|display|find|get|tell
  excluded_groups:
  - - 查看|查询|列出|显示|展示|show|list|display|find|get
    - 历史|记录|日志|状态|进度|上次|history|record|records|log|logs|status|progress|previous|last
  threshold: 1
  margin: 1
entry: find
steps:
- id: find
  title:
    zh: 查找低质文件
    en: Find low-quality files
  type: tool
  tool: search_files
  arguments:
    dataset_id: ${inputs.dataset_id}
    quality_max: ${inputs.quality_max}
    limit: 1000
  next: has_files
- id: has_files
  title:
    zh: 判断是否需要清理
    en: Check whether cleanup is needed
  type: branch
  ref: ${steps.find.data.objects}
  op: ne
  value: []
  then: quarantine
  otherwise: empty
- id: quarantine
  title:
    zh: 隔离低质文件
    en: Quarantine low-quality files
  type: tool
  tool: quarantine_files
  arguments:
    selection: &id001
      dataset_id: ${inputs.dataset_id}
      filters:
      - field: id
        operator: in
        value:
          $pluck:
          - ${steps.find.data.objects}
          - asset_ref.asset_id
  next: delete
- id: delete
  title:
    zh: 签批并删除文件
    en: Approve and delete files
  type: approval
  action: delete_files
  arguments:
    selection: *id001
  next: quality
- id: quality
  title:
    zh: 复查质量评分
    en: Recheck quality score
  type: tool
  tool: get_quality
  arguments:
    dataset_id: ${inputs.dataset_id}
  next: result
- id: result
  title:
    zh: 汇总清理结果
    en: Summarize cleanup results
  type: output
  value:
    conclusion: cleaned
    total: ${steps.quality.data.total}
    file_count: ${steps.quality.data.file_count}
- id: empty
  title:
    zh: 确认无需清理
    en: Confirm no cleanup is needed
  type: output
  value:
    conclusion: no_low_quality_files
