id: low-quality-cleanup
name: 低质样本清理 / Low-quality sample cleanup
description: Clean low-quality data out of a dataset, however colloquially the disposal is
  worded. Find files whose quality score is at or below a limit, quarantine them, delete them
  after approval, and recheck quality. Changes data. Not for only listing, counting or viewing
  low-quality items, for one selected file, or when told to hold off.
inputs:
  dataset_id:
    type: string
    description: Already imported dataset identifier / 已导入的数据集 ID
  quality_max:
    type: number
    description: Maximum selected quality score / 低质分数上限
    default: 60
