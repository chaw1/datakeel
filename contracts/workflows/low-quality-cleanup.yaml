id: low-quality-cleanup
name: 低质样本清理 / Low-quality sample cleanup
description: Clean low-quality data out of a dataset. Find files whose quality score is at or
  below a limit, quarantine them, delete them after approval, and recheck quality. Changes
  data.
inputs:
  dataset_id:
    type: string
    description: Already imported dataset identifier / 已导入的数据集 ID
  quality_max:
    type: number
    description: Maximum selected quality score / 低质分数上限
    default: 60
triggers:
  concepts:
    entities:
    - 低质|低质量|低分|不合格|劣质|质量差|质量不好|质量不行|质量太差|不达标|垃圾|脏数据|坏样本|坏文件|废样本|废数据|残次|次品|噪声|噪音|有问题的样本|有问题的文件
    - low-quality|low quality|poor-quality|poor quality|poor|low-scoring|low scoring|low-score|substandard|sub-standard|subpar|sub-par|defective|bad|junk|garbage|trash|noisy|corrupt|corrupted|broken|unusable|below-threshold|below threshold|failing|quality below
    actions:
    - 清理|清掉|清一下|清除|清走|清干净|清出去|清洗|处理掉|去掉|去除|剔除|剔掉|筛掉|筛除|滤掉|过滤掉|扔掉|丢掉|干掉|删掉|删光|删干净|淘汰|收拾|拿掉|挑掉
    - cleanup|clean up|clean out|clean|clear out|clear away|get rid of|weed out|filter out|throw out|throw away|toss|toss out|purge|prune|scrub|cull|tidy up|dispose of|dispose|strip out|root out|eliminate|discard|ditch|drop
  keywords:
  - - 低质|低质量|low-quality|low quality|poor-quality|poor quality
    - 样本|文件|sample|samples|file|files
    - 清理|cleanup|clean up
  classification_keywords:
  - 清理
  - cleanup
  - clean up
  classification_groups:
  - - 低质|低分|不合格|劣质|质量差|quality below|poor quality|low-quality|low quality|low-scoring|substandard|defective|bad
    - 样本|文件|条目|sample|samples|file|files|items
    - 收拾|整理|处理掉|清除|淘汰|purge|tidy up|dispose|cull
  - - 低质|低分|不合格|劣质|质量差|poor quality|low-quality|low quality|low-scoring|substandard|defective
    - 样本|文件|条目|sample|samples|file|files|items
    - 移除|删除|remove|delete
    - 复查|重查|重新检查|recheck|reassess|review quality
  excluded_keywords:
  - 谁|负责人|who|owner|where|哪里|如果|假如|if|suppose
  - 别清理|别删除|别修改|别改|先别|暂时别|不修改|不更改|无需|without
  - 备注|名称|名字|说明文档|description|documentation|name|label|layout|formatting
  - explain
  - what is
  - what does
  - how does
  - do not
  - don't
  - 不要
  - 选中|选定|selected|chosen|单个|single
  - 解释
  - 说明一下
  - 是什么
  - 仅查看
  - 只查看
  - 介绍|说明|如何|怎么|how to|how do
  - 什么|哪些|为什么|是否|需不需要|why|what is|what are|what was|what were|what does|what did|what will
    |what would|what happens|how many|how much|how long|how often|how is|how are|how was|how does
    |how did|how will|how would|how to|how do|does it|does the|does this|does that
  excluded_prefixes:
  - 查看|查询|列出|显示|展示|获取|show|list|display|find|get|tell|read|describe|should
  excluded_groups:
  - - 查看|查询|列出|显示|展示|看看|看一下|read|look at|bring up|show|list|display|find|get
    - 历史|记录|日志|状态|进度|上次|最近一次|history|record|records|log|logs|status|progress|previous|last|latest
  threshold: 1
  margin: 1
entry: find
steps:
- id: find
  title:
    zh: 查找低质文件
    en: Find low-quality files
  type: tool
  tool: search_files
  arguments:
    dataset_id: ${inputs.dataset_id}
    quality_max: ${inputs.quality_max}
    limit: 1000
  next: has_files
- id: has_files
  title:
    zh: 判断是否需要清理
    en: Check whether cleanup is needed
  type: branch
  ref: ${steps.find.data.objects}
  op: ne
  value: []
  then: quarantine
  otherwise: empty
- id: quarantine
  title:
    zh: 隔离低质文件
    en: Quarantine low-quality files
  type: tool
  tool: quarantine_files
  arguments:
    selection: &id001
      dataset_id: ${inputs.dataset_id}
      filters:
      - field: id
        operator: in
        value:
          $pluck:
          - ${steps.find.data.objects}
          - asset_ref.asset_id
  next: delete
- id: delete
  title:
    zh: 签批并删除文件
    en: Approve and delete files
  type: approval
  action: delete_files
  arguments:
    selection: *id001
  next: quality
- id: quality
  title:
    zh: 复查质量评分
    en: Recheck quality score
  type: tool
  tool: get_quality
  arguments:
    dataset_id: ${inputs.dataset_id}
  next: result
- id: result
  title:
    zh: 汇总清理结果
    en: Summarize cleanup results
  type: output
  value:
    conclusion: cleaned
    total: ${steps.quality.data.total}
    file_count: ${steps.quality.data.file_count}
- id: empty
  title:
    zh: 确认无需清理
    en: Confirm no cleanup is needed
  type: output
  value:
    conclusion: no_low_quality_files
