id: metric-change
name: 指标口径变更 / Metric definition change
description: Change how a metric is calculated and compare the answers. Read the current
  definition and answer, inspect impact, apply a reversible definition override, then ask
  the same question again and compare. Changes the metric definition.
inputs:
  metric_id:
    type: string
    description: Metric identifier / 指标 ID
    default: retail_revenue
  override:
    type: object
    description: Deeply merged metric definition changes / 指标定义深合并改动
    default:
      measure:
        column: ecommerce/main/orders/list_amount
  question:
    type: string
    description: Question asked before and after the change / 变更前后的同一问题
    default: 上个季度华东区零售额是多少
  reference_instant:
    type: string
    description: Fixed UTC question reference / 固定问数时间
    default: '2026-10-01T00:00:00Z'
triggers:
  concepts:
    entities:
    - 口径|指标口径|统计口径|计算口径|取数口径|指标定义|定义|计算方式|计算方法|计算逻辑|计算公式|公式|算法|取数逻辑|度量|度量字段|度量列|度量表达式|计算字段|计算列|取数字段
    - metric definition|definition|definitions|defined|redefine|formula|formulas|calculation|calculations|calculated|computed|computation|calculation field|calculation logic|measure|measures|measure column|measure field|measure expression|metric logic|metric calculation|metric formula
    actions:
    - 改|改成|改为|改一下|修改|更改|调整|调一下|换|换成|换掉|替换|切换|重设|重新定义|变更|动一下
    - change|switch|swap|replace|redefine|revise|alter|modify|tweak|adjust|update|rework|override|repoint|use a different|use another
    outcomes:
    - 对比|比较|对照|前后|再问|重问|重新问|再算|重算|重新算|再跑|重跑|再回答|差别|差异|区别|变化|新旧|两版|答案|问数结果
    - compare|comparison|contrast|before and after|before/after|side by side|side-by-side|recompute|recalculate|rerun|re-run|re-ask|reask|ask again|ask it again|question again|same question|answer again|difference|differences|diff|what changes|how it changes|old and new|new answer|answer|answers
  keywords:
  - - 指标口径变更|metric definition change
    - 做|运行|执行|启动|开展|run|perform|conduct|start|begin|prioritize|do
  - - 度量字段|度量列|measure column
    - 更改|修改|改为|改成|换成|替换|调整|change|switch|replace|update
    - 重新问数|重问|再问|再回答|ask again|question again
  - - 度量字段|度量列|measure column
    - 更改|修改|改为|改成|换成|替换|调整|change|switch|replace|update
    - 答案|问数结果|answer|answers|result|results
    - 对比|比较|compare|before/after|before and after
  classification_keywords:
  - 口径变更
  - 度量字段
  - definition change
  - measure column
  classification_groups:
  - - 指标口径|指标计算|计算字段|计算列|度量字段|度量表达式|metric calculation|metric formula|metric definition|calculation
      field|measure column
    - 调整|替换|换掉|重设|改动|revise|alter|rework|swap|different
    - 再算|重问|对照|比较|前后|recompute|rerun|compare|contrast
  excluded_keywords:
  - 谁|负责人|who|owner|where|哪里|如果|假如|if|suppose
  - 别清理|别删除|别修改|别改|先别|暂时别|不修改|不更改|无需|without
  - 备注|名称|名字|说明文档|description|documentation|name|label|layout|formatting
  - explain
  - what is
  - what does
  - how does
  - do not
  - don't
  - 不要
  - 解释
  - 说明一下
  - 是什么
  - 仅查看
  - 只查看
  - 介绍|说明|如何|怎么|how to|how do
  - 描述|释义|description|documentation|负责人|owner|名称|名字|name|label
  - 什么|哪些|为什么|是否|需不需要|why|what is|what are|what was|what were|what does|what did|what will
    |what would|what happens|how many|how much|how long|how often|how is|how are|how was|how does
    |how did|how will|how would|how to|how do|does it|does the|does this|does that
  excluded_prefixes:
  - 查看|查询|列出|显示|展示|获取|show|list|display|find|get|tell|read|describe|should
  excluded_groups:
  - - 查看|查询|列出|显示|展示|看看|看一下|read|look at|bring up|show|list|display|find|get
    - 历史|记录|日志|状态|进度|上次|最近一次|history|record|records|log|logs|status|progress|previous|last|latest
  threshold: 1
  margin: 1
entry: current
steps:
- id: current
  title:
    zh: 查看当前指标定义
    en: Inspect current metric definition
  type: tool
  tool: explain_metric
  arguments:
    metric_id: ${inputs.metric_id}
  next: before
- id: before
  title:
    zh: 获取变更前答案
    en: Get answer before change
  type: tool
  tool: ask_data
  arguments: &id001
    question: ${inputs.question}
    metric_id: ${inputs.metric_id}
    reference_instant: ${inputs.reference_instant}
  next: impact
- id: impact
  title:
    zh: 检查变更影响面
    en: Inspect change impact
  type: tool
  tool: impact_of
  arguments:
    asset_id: ${inputs.metric_id}
  next: update
- id: update
  title:
    zh: 更新指标定义
    en: Update metric definition
  type: tool
  tool: update_metric
  arguments:
    definition:
      $merge:
      - ${steps.current.data.definition}
      - ${inputs.override}
  next: after
- id: after
  title:
    zh: 获取变更后答案
    en: Get answer after change
  type: tool
  tool: ask_data
  arguments: *id001
  next: comparison
- id: comparison
  title:
    zh: 对比变更前后答案
    en: Compare answers before and after
  type: output
  value:
    before_rows: ${steps.before.data.result.rows}
    after_rows: ${steps.after.data.result.rows}
    rows_equal:
      $rows_equal:
      - ${steps.before.data.result.rows}
      - ${steps.after.data.result.rows}
    impact: ${steps.impact.data}
