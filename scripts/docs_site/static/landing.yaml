en:
  page_title: "Datakeel — Local-First Workbench for Auditable AI Datasets, Traceable Metrics & Controlled MCP"
  meta_desc: "Open-source (Apache-2.0) local-first workbench for AI dataset proofreading and split-leakage releases, traceable metric Q&A with lineage, and human-approved MCP agents."
  h1: "The local-first workbench for auditable AI datasets, traceable metrics, and human-approved agents."
  lead: "Review multimodal training samples and freeze SHA-256 dataset releases, trace business metric answers to registered SQL and lineage, and connect AI agents or MCP servers behind digest-bound human sign-off."
  cta_docs: "Read Documentation"
  cta_tour: "Guided Demo Tour"
  cta_github: "View on GitHub"
  qs_bar: "Quick start · No database server or API keys required (local SQLite + offline demo)"
  copy_label: "Copy"
  copied_label: "Copied"
  hero_caption: "Fig. 1 — Dataset delivery review comparing a duplicate image found across training and test splits before signing a corrected SHA-256 release."
  pillars_kicker: "Three Core Workflows"
  pillars_h2: "One auditable workbench for datasets, metrics, and controlled agents"
  pillars_lead: "Every assertion, metric answer, and write action traces back to source evidence, append-only events, and explicit human approvals."
  visual_kicker: "Live Walkthrough & Architecture"
  visual_h2: "See all three workflows in 18 seconds"
  visual_cap1: "18-second live walkthrough: visual QA & evidence anchors, registered-SQL metric Q&A, and digest-bound human approval."
  visual_cap2: "Modular monolith architecture: FastAPI + leased worker over SQLite/PostgreSQL and local or S3 storage."
  compare_kicker: "Where Datakeel Fits"
  compare_h2: "Honest boundaries vs. single-purpose tools"
  compare_lead: "Datakeel complements warehouses and training frameworks by uniting visual QA, traceable metric answers, and approval-gated MCP actions."
  th_cap: "Dimension"
  th_dk: "Datakeel"
  th_other: "Typical point-tool stack"
  docs_kicker: "Documentation Hub"
  docs_h2: "Explore guides by workflow"
  faq_kicker: "FAQ"
  faq_h2: "Common questions on setup, split leakage, Ask data, and MCP safety"
  hero_img: "assets/images/dataset-delivery-en.png"
  evidence_img: "assets/images/demo-walkthrough.gif"
  docs_href: "docs/"
  tour_href: "docs/demo/"
  url_path: ""
  alt_url: "zh/"
  pillars:
    - index: "[1]"
      eyebrow: "AI Datasets & Visual QA"
      title: "Proofread samples and deliver verifiable versions"
      summary: "Inspect images, captions, annotations, and split leakage side by side before freezing an immutable SHA-256 dataset release."
      bullets:
        - "Three-state evidence (present, absent, unknown) prevents missing labels from passing."
        - "Detect exact, perceptual dHash, SimHash, and group split leakage across partitions."
        - "Export COCO, YOLO, Hugging Face, or JSONL and verify packages via datakeel reconcile."
      doc_href: "docs/dataset-delivery/"
      doc_label: "Dataset delivery guide ->"
    - index: "[2]"
      eyebrow: "Metrics, Catalog & Lineage"
      title: "Trace every business number back to its SQL and owner"
      summary: "Answer plain-language metric questions from registered definitions with parameterized SQL, source columns, and lineage instead of unverified guesses."
      bullets:
        - "Bound SQL, metric version, owner, and time window accompany every Ask data answer."
        - "Ambiguous or unauthorized questions trigger clarification or refusal, never guesses."
        - "Import dbt, Airflow, and OpenLineage metadata alongside data standards and assets."
      doc_href: "docs/ask/"
      doc_label: "Ask data & catalog ->"
    - index: "[3]"
      eyebrow: "Controlled Agents & MCP"
      title: "Let AI agents investigate, while humans sign every write"
      summary: "Connect Claude Desktop, Cursor, or the built-in Copilot over local stdio or SSE without letting models delete files, mutate metrics, or send data unapproved."
      bullets:
        - "Agents read audited assets and prepare frozen action plans with impact and cost notes."
        - "Destructive or outbound steps pause at a digest-bound approval sheet with expiry."
        - "Every tool call, approval receipt, and OTLP trace lands in append-only history."
      doc_href: "docs/actions/"
      doc_label: "Controlled actions & MCP ->"
  comparison:
    - capability: "Deployment footprint"
      datakeel: "Local-first SQLite + loopback UI in two commands; scales to PostgreSQL + S3."
      single_purpose: "Often requires multi-container clusters (catalogs) or SaaS accounts."
    - capability: "Dataset QA & split leakage"
      datakeel: "Built-in three-state evidence matrix, visual review, and cross-split leakage check."
      single_purpose: "Split across separate visualization (FiftyOne), labeling (Label Studio), and scripts."
    - capability: "Verifiable dataset delivery"
      datakeel: "Signed release plans, immutable SHA-256 manifests, and offline datakeel reconcile."
      single_purpose: "File-level version tools (DVC) track hashes but not review sign-off or leakage proofs."
    - capability: "Natural-language metric Q&A"
      datakeel: "Registered semantic definitions + parameterized SQL + explicit ambiguity refusal."
      single_purpose: "Ad-hoc text-to-SQL bots generate unreviewed SQL with no metric version binding."
    - capability: "AI Agent & MCP governance"
      datakeel: "Read/propose-only MCP tools; digest-bound human approval required before writes."
      single_purpose: "Generic MCP database connectors execute arbitrary queries or lack plan sign-off."
  faq:
    - question: "Do I need cloud API keys or a database server to try Datakeel?"
      answer: "No. Running uv sync --locked and uv run datakeel demo starts the API, worker, bundled web UI, local SQLite state, and an offline deterministic provider with generated image, metric, and knowledge-graph samples."
    - question: "How does Datakeel detect train/test dataset leakage?"
      answer: "Datakeel computes exact hashes, perceptual 64-bit dHash fingerprints, SimHash text fingerprints, and group keys across dataset partitions, lets reviewers inspect matches side by side, and records the checked result inside the signed release manifest."
    - question: "How does Ask data prevent hallucinated SQL?"
      answer: "Ask data resolves questions against registered metric definitions and parameterized SQL templates rather than free-form SQL generation. Each answer returns the metric version, owner, SQL, source columns, and time range, and refuses ambiguous queries."
    - question: "Can an MCP client or AI agent delete data or modify metrics autonomously?"
      answer: "No. Datakeel's MCP server never exposes approval or execution tools. Agents can inspect permitted assets and prepare frozen action plans, while a human approves and runs writes in the Web UI or CLI against the exact plan digest."
    - question: "Can Datakeel scale beyond one laptop for a small team?"
      answer: "Yes. The same application runs over PostgreSQL and S3-compatible object storage behind an authenticating reverse proxy (Caddy or nginx with oauth2-proxy), with Docker Compose deployment guides and role-based action scopes."
    - question: "What license does Datakeel use?"
      answer: "Datakeel is licensed under Apache-2.0 with an automated runtime license audit covering Python, frontend, and optional Rust extension dependencies."

zh:
  page_title: "Datakeel — 本地优先的可审计数据工作台（AI 数据集、可追溯问数与受控 MCP）"
  meta_desc: "Datakeel 是一款 Apache-2.0 本地优先数据工作台：支持 AI 数据集校样与切分泄漏交付、可追溯 SQL 指标问数与血缘，以及人工签批的智能体与 MCP 服务。"
  h1: "本地优先的可审计数据工作台：AI 样本校样、可追溯问数与人工签批智能体。"
  lead: "在一套可单机运行的工具里完成三件事：审阅并交付可离线核验的 AI 数据集版本，把业务指标追溯到参数化 SQL 与血缘，并让 AI 智能体与 MCP 在人工签批边界内协作。"
  cta_docs: "浏览文档中心"
  cta_tour: "10 分钟演示导览"
  cta_github: "前往 GitHub 仓库"
  qs_bar: "快速上手 · 无需外部数据库或模型密钥（SQLite + 离线演示模型）"
  copy_label: "复制命令"
  copied_label: "已复制"
  hero_caption: "图 1 — 数据集交付审查：并排核对训练集与测试集中的跨划分重复图片，确认排除后再签批 SHA-256 发布包。"
  pillars_kicker: "三大主线"
  pillars_h2: "面向数据集交付、企业问数与受控智能体的统一校样台"
  pillars_lead: "所有结论都回到原始证据、只追加事件与显式审批回执，单机即可启动，团队可按需扩展。"
  visual_kicker: "实机演示与架构"
  visual_h2: "18 秒看懂三条核心工作流"
  visual_cap1: "18 秒本地实机演示：样本证据校样、绑定参数化 SQL 的指标问数，以及红笔不可逆标识的人工签批单。"
  visual_cap2: "系统架构：FastAPI 与带租约 worker、分层领域契约、SQLite/PostgreSQL 与本地/S3 存储。"
  compare_kicker: "定位边界"
  compare_h2: "Datakeel 适合什么场景，与单点工具的区别"
  compare_lead: "Datakeel 不替代数仓或模型训练框架，而是把样本校样、口径问数和动作审批串成可审计闭环。"
  th_cap: "关注维度"
  th_dk: "Datakeel"
  th_other: "常见单点工具组合"
  docs_kicker: "完整文档"
  docs_h2: "按工作流查阅中英文指南"
  faq_kicker: "常见问题"
  faq_h2: "关于部署、数据泄漏、问数与 MCP 安全的常见解答"
  hero_img: "assets/images/dataset-delivery-zh.png"
  evidence_img: "assets/images/demo-walkthrough.gif"
  docs_href: "zh/docs/"
  tour_href: "zh/docs/demo/"
  url_path: "zh/"
  alt_url: ""
  pillars:
    - index: "[1]"
      eyebrow: "AI 数据集与视觉校样"
      title: "审阅样本证据，交付可离线核验的数据集版本"
      summary: "在冻结不可变 SHA-256 数据集发布包前，并排核对图片、文本描述、标注冲突与跨划分泄漏。"
      bullets:
        - "证据区分「有」「无」「未知」，缺失标注不会悄悄被当成阴性样本放行。"
        - "支持精确、dHash、SimHash 与组键切分泄漏检查，按确认清单生成修正版本。"
        - "导出 COCO、YOLO、Hugging Face 或 JSONL，并用 datakeel reconcile 离线对账。"
      doc_href: "zh/docs/dataset-delivery/"
      doc_label: "查看数据集交付指南 ->"
    - index: "[2]"
      eyebrow: "可追溯问数、目录与血缘"
      title: "把每个业务数字追溯到指标口径、SQL 与负责人"
      summary: "用自然语言问数时，只从已登记指标口径返回结果，完整附带参数化 SQL、来源字段、时间窗口与血缘。"
      bullets:
        - "口径歧义或缺少资产授权时明确追问或拒答，不靠大模型自由猜测编造 SQL。"
        - "支持导入 dbt、Airflow 与 OpenLineage 元数据，联动数据标准、质量规则与资产授权。"
        - "中英文界面支持多轮追问、确定性图表选择与可回放保存答案。"
      doc_href: "zh/docs/ask/"
      doc_label: "查看问数与目录文档 ->"
    - index: "[3]"
      eyebrow: "受控智能体与 MCP 服务"
      title: "让智能体负责检索与规划，所有写入必须由人签批"
      summary: "通过本机 stdio 或回环 SSE 接入 Claude Desktop、Cursor 或内置副驾，只允许准备计划，绝不擅自改数或外发。"
      bullets:
        - "智能体与 MCP 只能发起受审计读取和计划草拟，附带影响对象、外发范围与预估费用。"
        - "删除、改口径、外发等动作停在绑定计划摘要的签批单，确认后才执行。"
        - "所有调用轨迹、签批回执与脱敏 OTLP Trace 保存在只追加历史中。"
      doc_href: "docs/actions/"
      doc_label: "查看受控动作与 MCP ->"
  comparison:
    - capability: "部署与起步成本"
      datakeel: "本地优先，一条演示命令即用 SQLite 启动；团队可平滑迁移到 PostgreSQL + S3。"
      single_purpose: "重型数据目录通常需要多组件集群，标注平台多依赖云端 SaaS。"
    - capability: "样本校样与切分泄漏"
      datakeel: "内置三态证据矩阵、视觉校样与跨划分近重复泄漏审查，审完直接出修正版。"
      single_purpose: "往往需要把可视化（FiftyOne）、标注（Label Studio）和质检脚本手动拼在一起。"
    - capability: "可核验交付与对账"
      datakeel: "冻结发布计划签批 + SHA-256 清单 + datakeel reconcile 离线复核交付证明。"
      single_purpose: "文件版本工具（如 DVC）只管文件哈希，不记录审查证明与审批回执。"
    - capability: "业务问数与口径溯源"
      datakeel: "严格绑定已登记指标口径与参数化 SQL，歧义追问、越权拒答，可跳血缘。"
      single_purpose: "常见 Text-to-SQL 助手直接自由生成 SQL，缺少口径版本绑定与拒答护栏。"
    - capability: "智能体与 MCP 安全边界"
      datakeel: "MCP 仅暴露受审计读取和计划准备，写操作与外发必须经过计划摘要签批。"
      single_purpose: "通用数据库 MCP 常直接执行写入或缺少可审计的审批挂起机制。"
  faq:
    - question: "试用 Datakeel 需要配置大模型 API Key 或安装数据库吗？"
      answer: "不需要。运行 uv sync --locked 和 uv run datakeel demo 就会在本地 SQLite 中启动 API、worker 和内置 Web 界面，并使用离线演示模型加载 1,000 张样例图片、企业指标与知识图谱演示数据。"
    - question: "Datakeel 如何检查训练集与测试集之间的数据泄漏？"
      answer: "平台支持精确哈希、64 位感知哈希 dHash、文本 SimHash 与组键泄漏检查，支持在浏览器中并排对比跨划分匹配样本，并将核查证明写入签批后的发布清单供离线对账。"
    - question: "「问数」功能怎么避免大模型瞎编 SQL？"
      answer: "问数不会让模型自由拼接未知 SQL，而是把自然语言绑定到已登记的指标定义版本与参数化 SQL；每次回答都展示口径、SQL、来源列和时间窗，遇到歧义会先追问或明确拒答。"
    - question: "接入 MCP 后，Claude Desktop 或 Cursor 会不会误删或乱改数据？"
      answer: "不会。Datakeel 的 MCP 服务从不暴露审批或执行写操作的工具；智能体只能读取已授权对象并草拟冻结计划，必须由人在 Web 界面或 CLI 核对计划摘要并签批后才会执行。"
    - question: "除了单机使用，小团队能共享部署吗？"
      answer: "可以。同一套应用支持切换到 PostgreSQL 与 S3 兼容对象存储，配合 Caddy 或 nginx + oauth2-proxy 反向代理即可做小团队共享部署，并内置操作人角色与动作权限范围。"
    - question: "Datakeel 使用什么开源许可？"
      answer: "项目采用 Apache-2.0 许可协议，并内置针对 Python、前端打包产物和可选 Rust 加速扩展的自动化运行时依赖许可审计。"
